<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Portfolio</title>
        <link rel="stylesheet" href="styles.css" />
        <script type="module" src="script.js" defer></script>
    </head>
    <body>
        <main>
            <section id="home">
                <img
                    src="./images/doodles/background-wave-1.svg"
                    class="background-wave"
                />
                <div class="navigation"></div>
                <div class="container">
                    <div class="images-container">
                        <img src="./images/doodles/blob.png" class="blob" />
                        <img src="./images/me/me.jpg" class="blob-image" />
                    </div>
                    <div class="content">
                        <h1>Hey Friends!</h1>
                        <h4>
                            Lorem ipsum dolor sit amet, consectetur adipisicing
                            elit. Eligendi quas consequatur consequuntur
                            exercitationem dolorem vitae?
                        </h4>
                        <div class="buttons-container">
                            <a
                                href="./assets/resume.pdf"
                                class="download-resume"
                                download
                            >
                                <span class="text">Resume</span>
                                <img
                                    src="./images/icons/download.svg"
                                    class="icon"
                                />
                            </a>
                            <a href="#contact-me" class="contact-me">
                                <span class="text">Contact Me</span>
                                <img
                                    class="icon"
                                    src="./images/icons/mail.svg"
                                />
                            </a>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </body>
</html>
